<script>
// [হলুদ] {গোলাপি} হাইলাইট
const L=[
["১ は・です・か・も・の","N1[は]N2{です}","বাক্য শেষে です। না-বোধক: じゃありません। প্রশ্ন: শেষে か। 'ও' অর্থে も, 'র/এর' অর্থে の।","わたし[は]がくせい{です}。 ⇒ আমি ছাত্র। / カリナさん[は]エンジニア{じゃありません}。 ⇒ কারিনা ইঞ্জিনিয়ার নয়।"],
["২ これ・それ・あれ","これ[は]ほん{です}","কাছে=これ, একটু দূরে=それ, অনেক দূরে=あれ। noun-এর সাথে この/その/あの। উত্তর: はい、そうです / いいえ、そうじゃありません।","これ[は]ほん{です}。 ⇒ এটা বই। / この ほん[は]わたし[の]{です}。 ⇒ এই বইটি আমার।"],
["৩ ここ・そこ・あそこ・どこ","きょうしつ[は]ここ{です}","জায়গা: ここ(এখানে) そこ(সেখানে) あそこ(ঐখানে) どこ(কোথায়)। দিক: こちら・そちら・あちら・どちら।","きょうしつ[は]ここ{です}。 ⇒ ক্লাসরুম এখানে। / トイレ[は]どこ{ですか}。 ⇒ টয়লেট কোথায়?"],
["৪ সময়, ます-form, に, から・まで, と","ごはん[を]たべます / たべません / たべました / たべませんでした","~じ~ふん=সময়। ます=বর্তমান/ভবিষ্যৎ। に=বার/তারিখ/সময়। から=থেকে, まで=পর্যন্ত। と=এবং/সাথে।","ごはん[を]たべます。 ⇒ আমি ভাত খাই। / 9じ[から]11じ[まで]べんきょうします。 ⇒ আমি ৯টা থেকে ১১টা পর্যন্ত পড়ি।"],
["৫ へ, で, よ","バス[で]がっこう[へ]いきます","へ=গন্তব্য (いきます/きます/かえります)। で=যানবাহন, যন্ত্র, কাজের জায়গা, ভাষা, 'মধ্যে'। よ=জোর দিয়ে জানানো। どこも/なにも+negative।","バス[で]がっこう[へ]いきます。 ⇒ আমি বাসে স্কুলে যাই। / レストラン[で]ひるごはん[を]たべます。 ⇒ আমি রেস্টুরেন্টে দুপুরের খাবার খাই।"],
["৬ を, なに/なん, ませんか・ましょう","おちゃ[を]のみませんか → はい、のみましょう","を=object (transitive verb-এর আগে)। ませんか=প্রস্তাব, ましょう=প্রস্তাব গ্রহণ। なに=verb-এর object, なん+で/と/の।","おちゃ[を]のみませんか。 ⇒ চা খাবেন না? / はい、のみ{ましょう}。 ⇒ হ্যাঁ, চলুন খাই।"],
["৭ に (লেনদেন), もう, まだ","N1[は]person[に]obj[を]あげます","লেনদেনের verb (おくります, かします, もらいます...) এ কে/থেকে=に। もう=ইতিমধ্যে (past), まだ=এখনো না (present negative)।","わたし[は]ロヒムさん[に]ほん[を]おくります。 ⇒ আমি রহিমকে বই পাঠাই। / もう あさごはん[を]たべました。 ⇒ আমি আগেই সকালের নাস্তা করেছি।"],
["৮ い/な adjective, が, そして, とても, あまり","さむい → さむかった / さむくない / さむくなかった","い-adj: い বদলে tense। な-adj: noun-এর মতো (きれいです/でした/じゃありません)। が=কিন্তু, そして=এবং। とても=খুব (affirmative), あまり/ぜんぜん=negative।","きょう[の]てんき[は]さむい です。 ⇒ আজকের আবহাওয়া ঠান্ডা। / にほんご[は]むずかしい です[が]、おもしろい です。 ⇒ জাপানি ভাষা কঠিন, কিন্তু মজার।"],
["৯ が, adverb, どうして","にほんご[が]わかります","わかります/できます/すき/ほしい/あります এর object-এর পরে が। よく・だいたい・すこし → わかります; たくさん・すこし → あります। どうして=কেন।","わたし[は]にほんご[が]わかります。 ⇒ আমি জাপানি ভাষা বুঝি। / どうして にほん へ いきますか。 ⇒ কেন জাপান যাচ্ছেন?"],
["১০ あります・います, জায়গা, や","つくえ[に]ほん[が]あります / ねこ[は]へや[に]います","জড় বস্তু=あります, প্রাণী/মানুষ=います। অবস্থান: うえ(উপরে) した まえ うしろ みぎ ひだり ちかく। や=এবং আরও (など)।","つくえ[の]うえ[に]ほん[が]あります。 ⇒ ডেস্কের উপরে বই আছে। / ねこ[は]きょうしつ[に]います。 ⇒ বিড়ালটি ক্লাসরুমে আছে।"],
["১১ গণনা, だけ, しか, ぐらい","ほん[を]2さつ{だけ}かいました","গণনা verb ও object-এর মাঝে। だけ=শুধু (affirmative), しか=ছাড়া (negative)। ぐらい=প্রায় (সময়ে ごろ)।","ほん[を]2さつ[だけ]かいました。 ⇒ আমি শুধু ২টি বই কিনেছি। / 100タカ[しか]ありません。 ⇒ আমার কাছে মাত্র ১০০ টাকাই আছে (এর বেশি নেই)।"],
["১২ より, どちら, いちばん","マンゴ[は]りんご[より]あまいです","より=এর চেয়ে। N1とN2とどちらが~? উত্তর: N[の]ほうが~。 সবচেয়ে: ~[で]なに[が]いちばん~?","マンゴ[は]りんご[より]あまい です。 ⇒ আম আপেলের চেয়ে মিষ্টি। / スポーツ[で]なに[が]いちばん たのしい ですか。 ⇒ খেলাধুলার মধ্যে কোনটা সবচেয়ে আনন্দদায়ক?"],
["১৩ ほしい, ~たい, ~に いきます","くるま[が]ほしい / にほん[へ]いきたい","ほしい=চাই (い-adj)। ます বাদ+たい=করতে চাই। Verb(ます বাদ)+に+いきます=করার জন্য যাই।","わたし[は]くるま[が]ほしい です。 ⇒ আমি গাড়ি চাই। / にほん[へ]いき[たい]です。 ⇒ আমি জাপান যেতে চাই।"],
["১৪ Verb group, て-form","し→して ・ き→いて ・ ぎ→いで ・ い/ち/り→って ・ み/び/に→んで ・ group2: ます→て","て+ください=অনুরোধ। て+います=চলছে। ます→ましょうか=সাহায্যের প্রস্তাব। する/くる: して/きて।","ほん[を]よんで{ください}。 ⇒ দয়া করে বইটি পড়ুন। / いま わたし[は]にほんご[を]かいて{います}。 ⇒ এখন আমি জাপানি ভাষা লিখছি।"],
["১৫ てもいいですか, てはいけません","はいって[もいいですか] / はなして[はいけません]","てもいいですか=অনুমতি চাওয়া। てはいけません=নিষেধ। に+すわります/のります/つきます/はいります/あいます।","ここ[で]しゃしん[を]とって[は いけません]。 ⇒ এখানে ছবি তোলা নিষেধ। / はいって[もいいですか]。 ⇒ প্রবেশ করতে পারি কি?"],
